<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Supintelligence</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    color: white;

    background:
    radial-gradient(circle at top right,
    rgba(130,0,255,.25),
    transparent 40%),

    radial-gradient(circle at bottom left,
    rgba(40,0,130,.35),
    transparent 45%),

    #05020d;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 30px 15px;
}


.contact-container {

    width: 100%;
    max-width: 700px;

    padding: 40px;

    border-radius: 25px;

    background:
    rgba(20,8,45,.75);

    border:
    1px solid rgba(170,70,255,.4);

    backdrop-filter: blur(15px);

    box-shadow:
    0 0 25px rgba(150,0,255,.25),
    0 0 80px rgba(80,0,255,.15);

}


h1 {

    text-align: center;

    margin-bottom: 8px;

    font-size: 38px;
}


.subtitle {

    text-align: center;

    color: #bbaad0;

    margin-bottom: 35px;
}


label {

    display: block;

    margin-top: 18px;
    margin-bottom: 7px;

    font-weight: 600;
}


input,
textarea {

    width: 100%;

    padding: 14px 15px;

    border-radius: 10px;

    border:
    1px solid rgba(180,100,255,.35);

    background:
    rgba(10,5,25,.8);

    color: white;

    outline: none;

    font-size: 16px;

    transition: .25s;
}


input:focus,
textarea:focus {

    border-color: #ad42ff;

    box-shadow:
    0 0 15px rgba(170,60,255,.35);
}


textarea {

    min-height: 160px;

    resize: vertical;
}


button {

    width: 100%;

    margin-top: 28px;

    padding: 15px;

    border: none;

    border-radius: 30px;

    cursor: pointer;

    color: white;

    font-size: 17px;

    font-weight: bold;

    background:
    linear-gradient(
    90deg,
    #6d00ff,
    #af00ff
    );

    box-shadow:
    0 0 20px rgba(160,0,255,.45);

    transition: .25s;
}


button:hover {

    transform: translateY(-2px);

    box-shadow:
    0 0 30px rgba(180,50,255,.65);
}


.back {

    display: block;

    text-align: center;

    margin-top: 25px;

    color: #c28cff;

    text-decoration: none;
}


.back:hover {

    color: white;
}


@media(max-width:600px){

    .contact-container {

        padding: 25px 20px;
    }

    h1 {

        font-size: 30px;
    }

}

</style>

</head>


<body>


<div class="contact-container">

<h1>Contact</h1>

<p class="subtitle">
Send us a message for Sale
</p>


<form action="https://api.web3forms.com/submit" method="POST">

  <input type="hidden" name="access_key" value="667bd089-6d9a-4377-a6f4-c40179747bd9">

  <input
    type="hidden"
    name="subject"
    value="Nouveau message depuis Supintelligence"
  >

  <label>Name *</label>
  <input
    type="text"
    name="name"
    required
  >

  <label>Email *</label>
  <input
    type="email"
    name="email"
    required
  >

  <label>Subject *</label>
  <input
    type="text"
    name="subject_user"
    required
  >

  <label>Message *</label>
  <textarea
    name="message"
    required
  ></textarea>

  <button type="submit">
    Send message
  </button>

</form>


<a href="index.html"
class="back">

← Back to Supintelligence

</a>


</div>


</body>

</html>
