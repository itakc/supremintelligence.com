<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Supintelligence</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #ffffff;
    background:
      radial-gradient(circle at top right, rgba(0, 160, 255, 0.15), transparent 35%),
      radial-gradient(circle at bottom left, rgba(0, 120, 255, 0.12), transparent 30%),
      linear-gradient(135deg, #020611 0%, #04122a 45%, #020816 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

  .contact-container {
    width: 100%;
    max-width: 1100px;
    background: rgba(3, 10, 28, 0.82);
    border: 1px solid rgba(64, 170, 255, 0.35);
    border-radius: 24px;
    box-shadow:
      0 0 25px rgba(0, 132, 255, 0.18),
      0 0 70px rgba(0, 89, 255, 0.10),
      inset 0 0 25px rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(10px);
    padding: 40px;
  }

  .contact-container h1 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 40px;
    color: #ffffff;
    text-align: center;
  }

  .contact-container p {
    text-align: center;
    color: #b8d8ff;
    margin-bottom: 35px;
    font-size: 18px;
  }

  .form-group {
    margin-bottom: 24px;
  }

  label {
    display: block;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: 700;
    color: #e9f5ff;
  }

  input,
  textarea {
    width: 100%;
    padding: 18px 20px;
    border-radius: 18px;
    border: 1px solid rgba(69, 160, 255, 0.45);
    background: rgba(4, 13, 33, 0.95);
    color: #ffffff;
    font-size: 17px;
    outline: none;
    transition: all 0.25s ease;
    box-shadow: inset 0 0 12px rgba(0, 180, 255, 0.04);
  }

  input::placeholder,
  textarea::placeholder {
    color: #7ea6c9;
  }

  input:focus,
  textarea:focus {
    border-color: #42c5ff;
    box-shadow:
      0 0 0 2px rgba(66, 197, 255, 0.12),
      0 0 18px rgba(0, 183, 255, 0.20),
      inset 0 0 12px rgba(0, 183, 255, 0.06);
    transform: translateY(-1px);
  }

  textarea {
    min-height: 180px;
    resize: vertical;
  }

  .submit-btn {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(90deg, #007bff 0%, #28b8ff 50%, #2d6bff 100%);
    color: #ffffff;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    box-shadow:
      0 0 18px rgba(0, 153, 255, 0.35),
      0 0 40px rgba(0, 110, 255, 0.20);
    transition: all 0.25s ease;
  }

  .submit-btn:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow:
      0 0 24px rgba(0, 183, 255, 0.45),
      0 0 50px rgba(0, 110, 255, 0.30);
  }

  .submit-btn:active {
    transform: scale(0.99);
  }

  .back-link {
    display: inline-block;
    margin-top: 22px;
    color: #8fd6ff;
    text-decoration: none;
    font-weight: 600;
    transition: 0.25s ease;
  }

  .back-link:hover {
    color: #ffffff;
    text-shadow: 0 0 10px rgba(0, 183, 255, 0.45);
  }

  @media (max-width: 768px) {
    .contact-container {
      padding: 28px 20px;
      border-radius: 18px;
    }

    .contact-container h1 {
      font-size: 30px;
    }

    .contact-container p {
      font-size: 16px;
    }

    input,
    textarea {
      font-size: 16px;
      padding: 16px;
    }

    .submit-btn {
      font-size: 18px;
      padding: 18px;
    }
  }
</style>

</head>


<body>

  <main class="contact-page">

    <div class="contact-container">

      <div class="contact-header">
        <h1>Contact</h1>

        <p class="subtitle">
          Interested in this domain? Send us a message.
        </p>
      </div>


      <form action="https://api.web3forms.com/submit" method="POST">

        <input
          type="hidden"
          name="access_key"
          value="5a1092f1-9007-4171-bf2c-ff2008e2d619"
        >

        <input
          type="hidden"
          name="subject"
          value="New message from supintelligence.fr"
        >

        <input
          type="checkbox"
          name="botcheck"
          class="hidden"
          style="display:none;"
        >


        <div class="form-group">
          <label for="name">Name *</label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            required
          >
        </div>


        <div class="form-group">
          <label for="email">Email *</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          >
        </div>


        <div class="form-group">
          <label for="subject_user">Subject *</label>

          <input
            type="text"
            id="subject_user"
            name="subject_user"
            placeholder="Your subject"
            required
          >
        </div>


        <div class="form-group">
          <label for="message">Message *</label>

          <textarea
            id="message"
            name="message"
            placeholder="Write your message here..."
            required
          ></textarea>
        </div>


        <button
          type="submit"
          class="submit-btn"
        >
          Send message
        </button>

      </form>


      <div class="contact-footer">

        <a
          href="index.html"
          class="back-link"
        >
          ← Back to Supintelligence
        </a>

      </div>

    </div>

  </main>

</body>

</html>
