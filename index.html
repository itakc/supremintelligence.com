<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Supintelligence</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #020712;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;

      background-image: url("vitrine.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .search-zone {
      position: absolute;
      left: 4%;
      bottom: 8%;

      width: 46%;
      max-width: 850px;
      min-width: 280px;
    }

    .search-bar {
      display: flex;
      align-items: center;

      gap: 14px;

      width: 100%;

      padding: 14px 18px;

      border-radius: 999px;

      background: rgba(0, 20, 55, 0.58);

      border: 2px solid rgba(0, 155, 255, 0.65);

      box-shadow:
        0 0 18px rgba(0, 145, 255, 0.35),
        0 0 40px rgba(0, 85, 255, 0.18),
        inset 0 0 20px rgba(255, 255, 255, 0.03);

      backdrop-filter: blur(10px);

      transition: all 0.25s ease;
    }

    .search-bar:focus-within {
      transform: translateY(-2px);

      box-shadow:
        0 0 25px rgba(0, 195, 255, 0.55),
        0 0 55px rgba(0, 100, 255, 0.28),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .icon-btn,
    .voice-btn {
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 58px;
      height: 58px;

      border-radius: 50%;

      color: white;

      font-size: 34px;

      background:
        radial-gradient(
          circle at 30% 30%,
          #008cff,
          #00366f
        );

      box-shadow:
        0 0 18px rgba(0, 160, 255, 0.45);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .icon-btn:hover,
    .voice-btn:hover {
      transform: scale(1.05);
    }

    .icon-btn:active,
    .voice-btn:active {
      transform: scale(0.98);
    }

    .search-input {
      flex: 1;

      background: transparent;

      border: none;
      outline: none;

      color: white;

      font-size: 1.2rem;

      padding: 0 10px;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.58);
    }

    .mic-btn {
      width: auto;
      height: auto;

      color: white;

      font-size: 25px;

      background: transparent;

      box-shadow: none;
    }

    .voice-btn {
      width: 64px;
      height: 64px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at 30% 30%,
          #60e5ff,
          #007bff 45%,
          #003b9f 100%
        );

      box-shadow:
        0 0 25px rgba(0, 180, 255, 0.55);

      animation: pulse 2s infinite;
    }

    .bars {
      display: flex;
      align-items: center;

      gap: 4px;

      height: 22px;
    }

    .bars span {
      width: 4px;

      border-radius: 2px;

      background: white;

      animation:
        equalizer 1s infinite ease-in-out;
    }

    .bars span:nth-child(1) {
      height: 10px;
      animation-delay: 0s;
    }

    .bars span:nth-child(2) {
      height: 18px;
      animation-delay: 0.15s;
    }

    .bars span:nth-child(3) {
      height: 26px;
      animation-delay: 0.3s;
    }

    .bars span:nth-child(4) {
      height: 16px;
      animation-delay: 0.45s;
    }

    .search-note {
      margin-top: 12px;

      color: rgba(255, 255, 255, 0.78);

      font-size: 0.95rem;

      text-shadow:
        0 0 8px rgba(0, 0, 0, 0.5);
    }

    .contact-btn {
      display: inline-block;

      margin-top: 24px;

      padding: 12px 28px;

      color: white;

      text-decoration: none;

      font-size: 16px;
      font-weight: 600;

      border:
        1px solid #009dff;

      border-radius: 30px;

      background:
        rgba(0, 50, 100, 0.55);

      box-shadow:
        0 0 10px #007cff,
        0 0 25px rgba(0, 150, 255, 0.35);

      transition: 0.3s;
    }

    .contact-btn:hover {
      background: #006fd1;

      transform: translateY(-2px);

      box-shadow:
        0 0 15px #00aaff,
        0 0 35px #004cff;
    }

    .shake {
      animation:
        shake 0.35s ease;
    }

    @keyframes pulse {
      0% {
        box-shadow:
          0 0 18px rgba(0, 175, 255, 0.35);
      }

      50% {
        box-shadow:
          0 0 35px rgba(0, 145, 255, 0.65);
      }

      100% {
        box-shadow:
          0 0 18px rgba(0, 175, 255, 0.35);
      }
    }

    @keyframes equalizer {
      0%,
      100% {
        transform: scaleY(0.7);
        opacity: 0.8;
      }

      50% {
        transform: scaleY(1.2);
        opacity: 1;
      }
    }

    @keyframes shake {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      50% {
        transform: translateX(5px);
      }

      75% {
        transform: translateX(-4px);
      }

      100% {
        transform: translateX(0);
      }
    }

    /* TABLETTE */
    @media (max-width: 1024px) {

      .hero {
        background-image:
          url("vitrine-tablette.png");

        background-position:
          center center;
      }

      .search-zone {
        width: 68%;

        left: 5%;

        bottom: 7%;
      }
    }

    /* TELEPHONE */
    @media (max-width: 768px) {

      .hero {
        background-image:
          url("vitrine-mobile.png");

        background-position:
          center top;

        background-size:
          cover;

        min-height:
          100svh;
      }

      .search-zone {
        left: 5%;
        right: 5%;

        width: auto;

        bottom: 5%;
      }

      .search-bar {
        padding:
          10px 12px;

        gap: 10px;
      }

      .icon-btn {
        width: 48px;
        height: 48px;

        font-size: 28px;
      }

      .voice-btn {
        width: 52px;
        height: 52px;
      }

      .search-input {
        font-size: 1rem;
      }

      .search-note {
        font-size: 0.82rem;
      }

      .contact-btn {
        padding:
          10px 24px;

        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">

    <div class="search-zone">

      <div class="search-bar" id="searchBar">

        <button
          class="icon-btn"
          id="plusBtn"
          title="Clear">
          +
        </button>

        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Ask your question..."
        >

        <button
          class="icon-btn mic-btn"
          id="micBtn"
          title="Microphone">
          🎤
        </button>

        <button
          class="voice-btn"
          id="searchBtn"
          title="Open ChatGPT">

          <div class="bars">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

        </button>

      </div>

      <div
        class="search-note"
        id="searchNote">

        Enter a search term, then press Enter or the illuminated button.

      </div>

      <a
        href="contact.html"
        class="contact-btn">

        Contact

      </a>

    </div>

  </div>

  <script>

    const input =
      document.getElementById("searchInput");

    const searchBtn =
      document.getElementById("searchBtn");

    const plusBtn =
      document.getElementById("plusBtn");

    const searchBar =
      document.getElementById("searchBar");

    const searchNote =
      document.getElementById("searchNote");


    function animateError() {

      searchBar.classList.remove("shake");

      void searchBar.offsetWidth;

      searchBar.classList.add("shake");
    }


    function sendToChatGPT() {

      const query =
        input.value.trim();

      if (!query) {

        searchNote.textContent =
          "Please enter a question.";

        animateError();

        return;
      }


      if (navigator.clipboard) {

        navigator.clipboard
          .writeText(query)
          .catch(() => {});
      }


      window.open(
        "https://chatgpt.com/",
        "_blank"
      );


      searchNote.textContent =
        "Question copied. Paste it into ChatGPT.";

    }


    searchBtn.addEventListener(
      "click",
      sendToChatGPT
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          sendToChatGPT();

        }

      }
    );


    plusBtn.addEventListener(
      "click",
      function() {

        input.value = "";

        input.focus();

        searchNote.textContent =
          "Enter a new question.";

      }
    );

  </script>

<style>

  /* CONTENEUR PRINCIPAL           */

  .supremator-widget {

  .supremator-hint {

  /* ============================= */

  .supremator-bubble {
    position: relative;

    width: 78px;
    height: 78px;

    padding: 0;

    border-radius: 50%;

    border: 2px solid rgba(90, 225, 255, 0.95);

    background: #00172f;

    cursor: pointer;

    overflow: visible;

    box-shadow:
      0 0 10px rgba(0, 210, 255, 0.95),
      0 0 25px rgba(0, 160, 255, 0.70),
      0 0 55px rgba(0, 100, 255, 0.38);

    transition:
      transform .25s ease,
      box-shadow .25s ease;
  }


  .supremator-bubble:hover {
    transform: scale(1.08);

    box-shadow:
      0 0 15px rgba(70, 230, 255, 1),
      0 0 35px rgba(0, 170, 255, .85),
      0 0 70px rgba(0, 100, 255, .55);
  }


  /* avatar */

  .supremator-avatar {
    position: absolute;

    inset: 3px;

    width: calc(100% - 6px);
    height: calc(100% - 6px);

    border-radius: 50%;

    object-fit: cover;

    display: block;

    z-index: 3;
  }


  /* ============================= */
  /* ANNEAUX HOLOGRAPHIQUES        */
  /* ============================= */

  .supremator-ring,
  .supremator-ring-2 {
    position: absolute;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    pointer-events: none;
  }


  .supremator-ring {
    width: 94px;
    height: 94px;

    border:
      1px solid rgba(0, 215, 255, 0.75);

    transform:
      translate(-50%, -50%);

    animation:
      suprematorPulse 2.2s infinite ease-out;

    z-index: 1;
  }


  .supremator-ring-2 {
    width: 108px;
    height: 108px;

    border:
      1px solid rgba(0, 125, 255, 0.35);

    transform:
      translate(-50%, -50%);

    animation:
      suprematorPulse2 3s infinite ease-out;

    z-index: 1;
  }


  @keyframes suprematorPulse {

    0% {
      transform:
        translate(-50%, -50%)
        scale(.82);

      opacity: .95;
    }

    100% {
      transform:
        translate(-50%, -50%)
        scale(1.35);

      opacity: 0;
    }

  }


  @keyframes suprematorPulse2 {

    0% {
      transform:
        translate(-50%, -50%)
        scale(.78);

      opacity: .65;
    }

    100% {
      transform:
        translate(-50%, -50%)
        scale(1.45);

      opacity: 0;
    }

  }


  /* ============================= */
  /* INDICATEUR DISPONIBLE         */
  /* ============================= */

  .supremator-status {
    position: absolute;

    right: 4px;
    bottom: 4px;

    width: 15px;
    height: 15px;

    background: #2effa4;

    border: 3px solid #00162c;

    box-shadow:
      0 0 8px rgba(46,255,164,.8);

    z-index: 5;
  }


  /* ============================= */
  /* FENÊTRE DU CHATBOT            */

  .supremator-chat {
    position: absolute;

    right: 0;
    bottom: 100px;

    width: 365px;

    border-radius: 22px;

    overflow: hidden;

    opacity: 0;

    visibility: hidden;

    transform:
      translateY(20px)
      scale(.96);

    transform-origin:
      bottom right;

    transition:
      opacity .3s ease,
      transform .3s ease,

  }


  .supremator-chat.open {

        Qui est Supremator ?
      </button>

    </div>


    <!-- saisie -->

    <div class="supremator-input-area">

      <input
        type="text"
        id="suprematorInput"
        class="supremator-input"
        placeholder="Posez votre question..."
        autocomplete="off"
      >

      <button
        class="supremator-send"
        id="suprematorSend"
        aria-label="Envoyer"
      >
        ➜
      </button>

    </div>


    <div class="supremator-footer">
      Supremator • Suprem Intelligence
    </div>

  </div>


  <!-- avatar flottant -->

  <button
    class="supremator-bubble"
    id="suprematorBubble"
    aria-label="Ouvrir Supremator"
  >

    <span class="supremator-ring"></span>
    <span class="supremator-ring-2"></span>

    <img
      src="supremator.png"
      alt="Supremator"
      class="supremator-avatar"
    >

    <span class="supremator-status"></span>

  </button>

</div>


<!-- ===================================================== -->
<!-- JAVASCRIPT                                            -->
<!-- ===================================================== -->

<script>

  const suprematorBubble =
    document.getElementById("suprematorBubble");

  const suprematorChat =
    document.getElementById("suprematorChat");

  const suprematorClose =
    document.getElementById("suprematorClose");

  const suprematorInput =
    document.getElementById("suprematorInput");

  const suprematorSend =
    document.getElementById("suprematorSend");

  const suprematorMessages =
    document.getElementById("suprematorMessages");

  const suprematorHint =
    document.getElementById("suprematorHint");



  /* ouvrir Supremator */

  suprematorBubble.addEventListener(
    "click",
    function() {

      suprematorChat.classList.toggle("open");

      if (
        suprematorChat.classList.contains("open")
      ) {

        suprematorHint.style.opacity = "0";

        setTimeout(
          () => suprematorInput.focus(),
          300
        );

      }

    }
  );



  /* fermer */

  suprematorClose.addEventListener(
    "click",
    function() {

      suprematorChat.classList.remove("open");

    }
  );



  /* ajouter message */

  function addMessage(
    text,
    sender
  ) {

    const message =
      document.createElement("div");

    message.className =
      "supremator-message " + sender;

    message.textContent =
      text;

    suprematorMessages.appendChild(
      message
    );

    suprematorMessages.scrollTop =
      suprematorMessages.scrollHeight;

  }



  /* réponses temporaires */

  function temporaryResponse(
    message
  ) {

    const question =
      message.toLowerCase();



    setTimeout(
      function() {

        if (
          question.includes("contact")
        ) {

          addMessage(
            "Vous pouvez utiliser la page Contact de Suprem Intelligence. Lorsque la connexion IA sera activée, je pourrai également vous orienter directement.",
            "bot"
          );

        }

        else if (
          question.includes("supremator")
        ) {

          addMessage(
            "Je suis Supremator, l'agent intelligent de Suprem Intelligence. Mon interface est déjà opérationnelle et ma connexion à l'intelligence artificielle sera la prochaine étape.",
            "bot"
          );

        }

        else if (
          question.includes("suprem intelligence") ||
          question.includes("supremintelligence")
        ) {

          addMessage(
            "Suprem Intelligence est un univers consacré à l'apprentissage, à la compréhension et à la maîtrise du savoir.",
            "bot"
          );

        }

        else {

          addMessage(
            "Mon interface est opérationnelle. La prochaine étape sera de connecter mon moteur d'intelligence artificielle pour pouvoir répondre réellement à cette question.",
            "bot"
          );

        }

      },
      550
    );

  }



  /* envoyer */

  function sendSuprematorMessage() {

    const message =
      suprematorInput.value.trim();

    if (!message) {
      return;
    }

    addMessage(
      message,
      "user"
    );

    suprematorInput.value = "";

    temporaryResponse(
      message
    );

  }



  suprematorSend.addEventListener(
    "click",
    sendSuprematorMessage
  );



  suprematorInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        sendSuprematorMessage();

      }

    }
  );



  /* boutons suggestions */

  document
    .querySelectorAll(
      ".supremator-suggestion"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            const message =
              this.dataset.message;

            addMessage(
              message,
              "user"
            );

            temporaryResponse(
              message
            );

          }
        );

      }
    );


  /* disparition automatique
     du petit message après 8 sec */

  setTimeout(
    function() {

      if (
        !suprematorChat.classList.contains(
          "open"
        )
      ) {

        suprematorHint.style.opacity = ".55";

      }

    },
    8000
  );

</script>
</body>
</html>
